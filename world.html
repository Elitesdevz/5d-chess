<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#213633"><title>City | 5D Chess</title><link rel="icon" href="/chess/emblem.svg" type="image/svg+xml"><link rel="stylesheet" href="/chess/styles.css"><link rel="stylesheet" href="/chess/shell.css"><link rel="stylesheet" href="/chess/world.css"><script type="module" src="/chess/world.js"></script></head>
<body data-page="world"><header class="masthead app-topbar"><a class="brand" id="brand-home" href="/chess/lobby.html"><img src="/chess/logo.png" width="48" height="48" alt=""><span><b>5D</b> Chess</span></a><div id="account-area" class="account-area"><a class="button" href="/chess/login.html">Log in</a></div></header>
<main class="world" id="city-world">
  <canvas id="world-canvas" tabindex="0" aria-label="5D Chess City. Move with WASD or the joystick. Move the mouse or drag on touch to look. Click to capture the mouse, Escape to release it, and E to interact."></canvas>
  <div class="world-dark" aria-hidden="true"></div><div class="world-names" aria-hidden="true"></div>
  <p id="world-connection" class="world-notice" role="status">Entering the city…</p>
  <button type="button" class="world-use" data-world-use hidden><kbd>E</kbd><span></span></button>
  <div class="world-stick" data-joystick aria-label="Movement joystick"><i></i></div>
  <aside class="world-panel world-table" id="world-table" hidden aria-label="Table controls"></aside>
  <dialog class="world-dialog" id="world-service" aria-labelledby="world-dialog-title"><div class="world-dialog-body"></div></dialog>
  <p class="world-error" id="world-error" role="alert" hidden></p>
</main>
</body></html>
